<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>ERRLevaOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ac:#8bc61f;--pn:#0c2316;--bd:#25523a;--fg:#e6f4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#020a05;color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
body{position:relative}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
#inst{background:#000;font:13px ui-monospace,monospace;overflow:auto;padding:6px}
#inst h3{margin:0 0 6px;background:var(--ac);color:#000;padding:3px 6px;font-size:13px;display:flex;gap:6px;align-items:center}
.r{display:flex;gap:8px;padding:5px 6px;cursor:pointer;align-items:center}.r:hover{background:#e6f4ea;color:#000}.r b{flex:1;font-weight:400}.r i{font-style:normal;color:#6cf}.r:hover i{color:#036}
.r input{background:#000;color:#6cf;border:1px solid #356;font:inherit;width:50%}
#lg{margin:6px;color:#8f8;white-space:pre-wrap}
#splash.on,#off.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;text-align:center}
#splash img{width:110px;animation:pu 1s infinite alternate}@keyframes pu{to{transform:scale(1.12)}}
#off button{font-size:18px;padding:12px 22px;border-radius:30px;border:1px solid var(--ac);background:none;color:var(--ac)}
#wall{position:absolute;inset:0;transition:background .5s}
#logo{position:absolute;left:50%;top:46%;width:min(36vw,160px);transform:translate(-50%,-50%);filter:drop-shadow(0 8px 20px #000a);pointer-events:none}
#icons{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:8px}
.ic{width:76px;text-align:center;font-size:11px;cursor:pointer;text-shadow:0 1px 3px #000;padding:4px;border-radius:8px;user-select:none}.ic:hover{background:#fff2}.ic span{display:block;font-size:28px}
#menu{position:absolute;left:6px;bottom:50px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:6px;display:none;grid-template-columns:repeat(3,80px);z-index:9998}
#wins{position:absolute;inset:0 0 44px;pointer-events:none}
.win{position:absolute;pointer-events:auto;width:min(94vw,480px);height:min(60vh,360px);background:var(--pn);border:1px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 12px 40px #000a;overflow:hidden;animation:pop .4s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}80%{transform:scale(.98)}to{transform:scale(1)}}
.win>header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#0a1c12;border-bottom:2px solid var(--ac);cursor:grab;touch-action:none;user-select:none}.win>header b{flex:1;font-size:13px}
.win>main{flex:1;min-height:0;overflow:auto;padding:8px}
button{font:inherit;color:var(--fg);background:#ffffff18;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:8px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g button{padding:8px 2px;font-size:12px}
.th{height:54px;border-radius:8px;border:2px solid var(--bd);cursor:pointer}
#bar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--pn);border-top:1px solid var(--bd);z-index:99999}
#bar button{border:0;background:none;font-size:17px;padding:6px 8px}#bar button:hover{background:#fff2}
#tb{flex:1;display:flex;gap:4px;overflow:hidden}#tb button{font-size:12px;background:#ffffff14;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ck{font-size:12px;padding:0 4px}
#toast{position:absolute;top:8px;right:8px;background:var(--pn);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;opacity:0;transition:.3s;pointer-events:none;z-index:99998}#toast.on{opacity:1}
</style></head><body>

const dbNow=k=>{clearTimeout(dbT[k]);return DBP?DBP(k).set(dbVal(k)).catch(()=>{}):Promise.resolve()};
function dbPut(k){if(DBP){clearTimeout(dbT[k]);dbT[k]=setTimeout(()=>dbNow(k),500)}}
addEventListener('pagehide',()=>['sys','cw','note'].forEach(k=>dbT[k]&&dbNow(k)));
async function wipe(){try{if(DBP)await tmo(Promise.all(['sys','cw','note'].map(k=>DBP(k).delete())),3000)}catch(e){}try{['errleva','errnote','errcw'].forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
async function dbLoad(){
 try{if(typeof claude=='undefined')return;const [db,u]=await tmo(Promise.all([claude.use('db'),claude.use('user')]),3000)||[];const id=u&&await u.id();if(!db||!id)return;DBP=k=>db.doc('data/users/'+id+'/'+k);
  const r=await tmo(Promise.all([DBP('sys').get(),DBP('cw').get(),DBP('note').get()]),4000);if(!r)return;
  const [a,b,c]=r;
  if(a.exists)Object.assign(st,JSON.parse(JSON.stringify(a.data().st||{})));else if(st.done)dbPut('sys');
  if(b.exists&&b.data().d)CW=b.data().d;else if(CW)dbPut('cw');
  if(c.exists)try{localStorage.errnote=c.data().t||''}catch(e){}
 }catch(e){}
 applyDisp();idleReset();$('#icons').style.zoom=st.ic||1}

$('#sm').onclick=()=>{const m=$('#menu');m.style.display=m.style.display=='grid'?'none':'grid'};
document.addEventListener('click',e=>{const k=e.target.closest('.ic'),p=e.target.closest('[data-p]');if(k){launch(k.dataset.k);$('#menu').style.display='none'}if(p)pw[p.dataset.p]()});
document.addEventListener('pointerdown',()=>st.click&&S.click(),true);
setInterval(()=>$('#ck').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:st.h24===0,timeZone:st.tz||undefined}),1e3);
blk('ERRLevaOS');dbLoad().then(()=>st.done?blk('ERRLevaOS выключена','⏻ Включить',boot):grub());
</script></body></html>
